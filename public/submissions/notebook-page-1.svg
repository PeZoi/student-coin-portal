<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dbeafe" stroke-width="1"/>
      <path d="M 20 0 L 20 40 M 0 20 L 40 20" fill="none" stroke="#eff6ff" stroke-width="0.7" stroke-dasharray="2,2"/>
    </pattern>
  </defs>
  <!-- Paper background -->
  <rect width="800" height="1050" rx="16" fill="#fffdf9"/>
  <rect x="20" y="20" width="760" height="1010" rx="8" fill="url(#grid)" stroke="#93c5fd" stroke-width="2"/>
  
  <!-- Red margin line -->
  <line x1="110" y1="20" x2="110" y2="1030" stroke="#fca5a5" stroke-width="2.5"/>

  <!-- Header box -->
  <rect x="40" y="36" width="720" height="84" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="60" y="68" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a">Họ và tên: Nguyễn Gia Bảo — Lớp 5A</text>
  <text x="60" y="98" font-family="Arial, sans-serif" font-size="15" fill="#475569">Bài tập: Viết đoạn văn ngắn (5-7 câu) miêu tả hoạt động cuối tuần</text>
  <rect x="640" y="48" width="100" height="34" rx="17" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="690" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Trang 1 / 3</text>

  <!-- Line numbers in margin -->
  <g font-family="monospace" font-size="14" fill="#94a3b8" font-weight="bold">
    <text x="65" y="195">Dòng 1</text>
    <text x="65" y="275">Dòng 2</text>
    <text x="65" y="355" fill="#e11d48">Dòng 3</text>
    <text x="65" y="435">Dòng 4</text>
    <text x="65" y="515">Dòng 5</text>
    <text x="65" y="595">Dòng 6</text>
  </g>

  <!-- Horizontal writing lines -->
  <g stroke="#93c5fd" stroke-width="1.5">
    <line x1="110" y1="200" x2="750" y2="200"/>
    <line x1="110" y1="280" x2="750" y2="280"/>
    <line x1="110" y1="360" x2="750" y2="360"/>
    <line x1="110" y1="440" x2="750" y2="440"/>
    <line x1="110" y1="520" x2="750" y2="520"/>
    <line x1="110" y1="600" x2="750" y2="600"/>
    <line x1="110" y1="680" x2="750" y2="680"/>
  </g>

  <!-- Handwritten content simulation -->
  <g font-family="'Comic Sans MS', 'Segoe Print', cursive, sans-serif" font-size="22" fill="#1e293b">
    <text x="135" y="192" font-weight="bold" fill="#1d4ed8">Topic: My Weekend with Family</text>
    <text x="135" y="272">On Saturday morning, I always wake up at seven o'clock.</text>
    
    <!-- Highlighted error on Line 3 -->
    <rect x="255" y="322" width="68" height="36" rx="6" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="135" y="352">My father <tspan fill="#e11d48" font-weight="bold">play</tspan> badminton with me in the yard.</text>
    <text x="290" y="314" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e11d48" text-anchor="middle">AI: plays</text>

    <text x="135" y="432">In the afternoon, I help my mother cook dinner.</text>
    <text x="135" y="512">We eat delicious food and watch cartoons together.</text>
    <text x="135" y="592">On Sunday, I visit my grandparents in the countryside.</text>
  </g>

  <!-- Stamp / Footer note -->
  <rect x="135" y="740" width="520" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6,4"/>
  <text x="160" y="775" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">Chữ ký phụ huynh xác nhận:</text>
  <text x="160" y="808" font-family="'Segoe Script', cursive, sans-serif" font-size="20" fill="#0f766e">Mẹ Bảo đã kiểm tra bài viết — Ngày 15/11/2026</text>
</svg>
