<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050">
  <rect width="800" height="1050" rx="20" fill="#1e1b4b"/>
  <!-- Top App Bar -->
  <rect x="40" y="40" width="720" height="70" rx="14" fill="#312e81"/>
  <text x="70" y="83" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">QUIZIZZ — KẾT QUẢ BÀI LÀM</text>
  <rect x="590" y="55" width="140" height="40" rx="20" fill="#10b981"/>
  <text x="660" y="81" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Hoàn thành</text>

  <!-- Main Score Card -->
  <rect x="40" y="140" width="720" height="320" rx="20" fill="#312e81" stroke="#4f46e5" stroke-width="2"/>
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#c7d2fe" text-anchor="middle">Unit 7: My Favorite Food (20 câu)</text>
  
  <circle cx="400" cy="310" r="80" fill="#059669" stroke="#34d399" stroke-width="6"/>
  <text x="400" y="305" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">100%</text>
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d1fae5" text-anchor="middle">20 / 20 câu đúng</text>

  <!-- Stats boxes -->
  <rect x="40" y="490" width="225" height="130" rx="16" fill="#065f46"/>
  <text x="152" y="545" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#34d399" text-anchor="middle">20</text>
  <text x="152" y="585" font-family="Arial, sans-serif" font-size="16" fill="#a7f3d0" text-anchor="middle">Câu trả lời đúng</text>

  <rect x="287" y="490" width="225" height="130" rx="16" fill="#3730a3"/>
  <text x="400" y="545" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#a5b4fc" text-anchor="middle">02:45</text>
  <text x="400" y="585" font-family="Arial, sans-serif" font-size="16" fill="#e0e7ff" text-anchor="middle">Thời gian hoàn thành</text>

  <rect x="535" y="490" width="225" height="130" rx="16" fill="#78350f"/>
  <text x="647" y="545" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#fbbf24" text-anchor="middle">18,500</text>
  <text x="647" y="585" font-family="Arial, sans-serif" font-size="16" fill="#fde68a" text-anchor="middle">Điểm xếp hạng</text>
</svg>
