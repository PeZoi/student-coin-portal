<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dbeafe" stroke-width="1"/>
      <path d="M 20 0 L 20 40 M 0 20 L 40 20" fill="none" stroke="#eff6ff" stroke-width="0.7" stroke-dasharray="2,2"/>
    </pattern>
  </defs>
  <rect width="800" height="1050" rx="16" fill="#fffdf9"/>
  <rect x="20" y="20" width="760" height="1010" rx="8" fill="url(#grid2)" stroke="#93c5fd" stroke-width="2"/>
  <line x1="110" y1="20" x2="110" y2="1030" stroke="#fca5a5" stroke-width="2.5"/>

  <rect x="40" y="36" width="720" height="84" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="60" y="68" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a">Phần 2: Từ vựng mới &amp; Đặt câu (Vocabulary)</text>
  <text x="60" y="98" font-family="Arial, sans-serif" font-size="15" fill="#475569">Chép mỗi từ mới 2 dòng và đặt câu minh họa</text>
  <rect x="640" y="48" width="100" height="34" rx="17" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="690" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Trang 2 / 3</text>

  <g font-family="monospace" font-size="14" fill="#94a3b8" font-weight="bold">
    <text x="65" y="195">Dòng 7</text>
    <text x="65" y="275">Dòng 8</text>
    <text x="65" y="355">Dòng 9</text>
    <text x="65" y="435">Dòng 10</text>
    <text x="65" y="515">Dòng 11</text>
  </g>

  <g stroke="#93c5fd" stroke-width="1.5">
    <line x1="110" y1="200" x2="750" y2="200"/>
    <line x1="110" y1="280" x2="750" y2="280"/>
    <line x1="110" y1="360" x2="750" y2="360"/>
    <line x1="110" y1="440" x2="750" y2="440"/>
    <line x1="110" y1="520" x2="750" y2="520"/>
  </g>

  <g font-family="'Comic Sans MS', 'Segoe Print', cursive, sans-serif" font-size="21" fill="#1e293b">
    <text x="135" y="192">1. badminton (n): môn cầu lông — I like playing badminton.</text>
    <text x="135" y="272">2. countryside (n): vùng quê — My grandparents live in the countryside.</text>
    <text x="135" y="352">3. delicious (adj): ngon miệng — My mom cooks delicious meals.</text>
    <text x="135" y="432">4. weekend (n): cuối tuần — Have a nice weekend!</text>
    <text x="135" y="512">5. together (adv): cùng nhau — We watch TV together.</text>
  </g>
</svg>
